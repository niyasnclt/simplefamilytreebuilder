<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree Maker</title>
<meta name="description" content="Build family trees with photos and export them as PNG or PDF. Everything stays in your browser.">
<meta name="theme-color" content="#F6F1E7">
<link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
</head>
<body>

<!-- ───────────────────────────────────────────────────────────── library -->
<section id="library" class="view">
  <header class="lib-head">
    <div class="lib-title">
      <h1>Family Trees</h1>
      <p id="lib-count" class="muted"></p>
      <p id="lib-storage" class="muted tiny"></p>
    </div>
    <div class="lib-actions">
      <input id="lib-search" type="search" placeholder="Search trees…" autocomplete="off">
      <button id="btn-backup" class="btn ghost" title="Download every tree and photo as one file">Backup</button>
      <button id="btn-restore" class="btn ghost" title="Restore from a backup file">Restore</button>
      <button id="btn-import-json" class="btn ghost">Import JSON</button>
      <button id="btn-new-outline" class="btn ghost">New from outline</button>
      <button id="btn-new" class="btn primary">New tree</button>
    </div>
  </header>
  <div id="lib-grid" class="lib-grid"></div>
  <div id="lib-empty" class="empty" hidden>
    <p>No trees yet.</p>
    <button class="btn primary" data-act="new">Create your first tree</button>
    <p class="muted tiny">Trees and photos are saved in this browser only — nothing is uploaded.</p>
  </div>
</section>

<!-- ────────────────────────────────────────────────────────────── editor -->
<section id="editor" class="view" hidden>
  <header class="topbar">
    <button id="btn-back" class="btn icon" title="Back to library">←</button>
    <input id="tree-name" class="name-input" placeholder="Tree name">
    <input id="tree-sub" class="sub-input" placeholder="Subtitle (optional)">
    <span id="save-state" class="save-state">Saved</span>
    <div class="spacer"></div>
    <label class="field inline">
      <span>Template</span>
      <select id="tree-template"></select>
    </label>
    <button id="btn-design" class="btn ghost">Design</button>
    <button id="btn-outline" class="btn ghost">Outline</button>
    <button id="btn-export" class="btn primary">Export</button>
  </header>

  <div class="workspace">
    <aside class="panel left">
      <div class="panel-head">
        <span>Structure</span>
        <div class="head-tools">
          <button id="btn-order" class="btn tiny ghost" title="Order branches by age, or arrange them by hand">
            Order<span id="order-state" class="pill"></span>
          </button>
          <button id="btn-collapse-all" class="btn tiny ghost" title="Collapse / expand all">⇕</button>
        </div>
      </div>
      <div id="outline" class="outline"></div>
    </aside>

    <main class="stage-wrap">
      <div id="stage-scroll" class="stage-scroll">
        <div id="stage" class="stage"></div>
      </div>
      <div class="zoombar">
        <button class="btn tiny" data-zoom="out">−</button>
        <span id="zoom-label">100%</span>
        <button class="btn tiny" data-zoom="in">+</button>
        <button class="btn tiny" data-zoom="fit">Fit</button>
        <button class="btn tiny" data-zoom="100">1:1</button>
      </div>
    </main>

    <aside class="panel right">
      <div class="panel-head"><span>Details</span></div>
      <div id="inspector" class="inspector"></div>
    </aside>
  </div>
</section>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="./app.js"></script>
<script>
  // Registered from a relative path so the app also works from a subdirectory (e.g. GitHub Pages).
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
